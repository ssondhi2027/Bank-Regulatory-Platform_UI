# Deploys API source changes straight to Cloud Run via Cloud Build. Terraform
# still owns the service, its service account, and BigQuery IAM (see infra/)
# — this only ships new code.
#
# One-time setup: set github_repo in terraform.tfvars and apply, then add the
# printed github_wif_provider and github_ci_service_account outputs as the
# GCP_WIF_PROVIDER and GCP_CI_SERVICE_ACCOUNT secrets on this repo.
name: deploy-api

on:
  push:
    branches: [main]
    paths: ["serve/api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: brp-api
          region: northamerica-northeast1
          source: serve/api
